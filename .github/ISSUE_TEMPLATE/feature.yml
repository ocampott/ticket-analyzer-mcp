name: Feature request
description: Propose a scoped product capability for ticket-analyzer-mcp.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or project problem should this solve?
      placeholder: Describe the current limitation and who it affects.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable behavior should be true after delivery?
      placeholder: Describe the expected user-facing result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State the intended boundaries and what this request must not change.
      placeholder: Include affected clients, providers, compatibility needs, and exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the verifiable conditions required for approval.
      placeholder: One criterion per line.
    validations:
      required: true
